<h1>Espectaculos</h1>
<button (click)="getEscenarios()" [disabled]="cargandoEscenarios()">
  {{ cargandoEscenarios() ? 'Cargando...' : 'Ver escenarios' }}
</button>

<ol *ngIf="escenarios().length > 0">
  <li *ngFor="let escenario of escenarios()">
    <span
      (click)="getEspectaculos(escenario)"
      [style.cursor]="cargandoEspectaculos() ? 'wait' : 'pointer'"
      [style.opacity]="cargandoEspectaculos() && escenarioSeleccionado() === escenario ? '0.6' : '1'"
    >
      {{ escenario.nombre }} - {{ escenario.descripcion }}
    </span>

    <span *ngIf="cargandoEspectaculos() && escenarioSeleccionado() === escenario">
      Cargando espectaculos...
    </span>

    <ul *ngIf="escenarioSeleccionado() === escenario && escenario.espectaculos && escenario.espectaculos.length > 0">
      <li *ngFor="let espectaculo of escenario.espectaculos">
        <span
          (click)="getNumeroDeEntradas(espectaculo)"
          [style.cursor]="cargandoEntradas() ? 'wait' : 'pointer'"
          [style.opacity]="cargandoEntradas() && espectaculoSeleccionado() === espectaculo ? '0.6' : '1'"
        >
          {{ espectaculo.artista }} - {{ espectaculo.fecha }}
        </span>

        <span *ngIf="cargandoEntradas() && espectaculoSeleccionado() === espectaculo">
          Cargando entradas...
        </span>

        <span *ngIf="espectaculoSeleccionado() === espectaculo && espectaculo.entradas && !cargandoEntradas()">
          Hay {{ espectaculo.entradas.total }} entradas, de las cuales
          <button type="button" class="link-button" (click)="irAComprarEntradas(espectaculo)">
            {{ espectaculo.entradas.libres }}
          </button>
          estan libres.
        </span>
      </li>
    </ul>
  </li>
</ol>
